[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tickerlab-core"
version = "0.1.0"
description = "Motor cuantitativo para detección de patrones en tickers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "polars>=1.2.1",
  "pyarrow>=17.0.0",
  "numpy>=1.26.4",
  "scipy>=1.13.1",
  "numba>=0.60.0",
  "pydantic>=2.8.2",
  "pyyaml>=6.0.2",
  "scikit-learn>=1.5.1",
  "yfinance>=0.2.40",
]

[project.optional-dependencies]
cli = [
  "typer>=0.12.3",
  "rich>=13.7.1",
]
dev = [
  "pytest>=8.3.2",
  "hypothesis>=6.112.0",
  "pytest-benchmark>=4.0.0",
]


[project.scripts]
tickerlab = "tickerlab.cli.main:app"

[tool.setuptools.packages.find]
include = ["tickerlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
